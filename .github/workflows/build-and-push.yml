# Builds every service's image, pushes to GHCR, then SSHes into the
# deploy VM to pull+restart. No test stage yet — the project has no
# automated test suite to run here.
name: build-and-push

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_base: ${{ steps.image_base.outputs.value }}
    strategy:
      matrix:
        service:
          - { name: ingestion, context: ingestion, dockerfile: ingestion/Dockerfile, build_args: "" }
          - { name: api, context: ., dockerfile: api/Dockerfile, build_args: "" }
          - { name: aggregator, context: ., dockerfile: workers/aggregator/Dockerfile, build_args: "" }
          - { name: detector, context: ., dockerfile: workers/detector/Dockerfile, build_args: "" }
          - { name: agent, context: ., dockerfile: workers/agent/Dockerfile, build_args: "" }
          - { name: generator, context: synthetic-gen, dockerfile: synthetic-gen/Dockerfile, build_args: "" }
          # NEXT_PUBLIC_* is inlined into the client bundle at build time,
          # so the deploy target's real URL has to be known here, not
          # just at container runtime. Set the NEXT_PUBLIC_API_URL repo
          # variable (Settings -> Secrets and variables -> Actions ->
          # Variables) once you know the deploy target's URL.
          - { name: dashboard, context: dashboard, dockerfile: dashboard/Dockerfile, build_args: "NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}" }
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image base (GHCR requires it; org/repo names aren't always already lowercase)
        id: image_base
        run: echo "value=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
        env:
          REGISTRY: ${{ env.REGISTRY }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          build-args: ${{ matrix.service.build_args }}
          tags: ${{ steps.image_base.outputs.value }}-${{ matrix.service.name }}:latest
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd log-anomaly-engine && git pull
            cd infra
            docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
